version: '3.9'
services:
  database:
    image: mongo:${MONGO_VERSION}
    entrypoint: [ "/usr/bin/mongod", "--keyFile", "/run/secrets/mongo-keyfile", "--replSet", "${REPLICASET_NAME}", "--dbpath", "/data/db", "--bind_ip", "0.0.0.0", "--tlsMode", "allowTLS", "--tlsCertificateKeyFile", "/etc/letsencrypt/services/mongo/${MONGO_HORIZON_SUFFIX}.pem", "--tlsCAFile", "/etc/letsencrypt/services/mongo/root.pem", "--tlsAllowInvalidHostnames", "--tlsAllowInvalidCertificates"]
    secrets:
      - source: mongo-keyfile
        uid: "999"
        gid: "999"
        mode: 0400
    configs:
      - mongo-healthcheck
    volumes:
      - mongodata:/data/db:rw
      - mongoconfigdb:/data/configdb:rw
      - acme-letsencrypt:/etc/letsencrypt:ro
    networks:
      - backend
    ports:
      - target: 27017
        published: 27017
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "sh /mongo-healthcheck"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 10s
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.mongo-member == true
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 1m30s
        monitor: 15s

  dbcontroller:
    image: petronem/mongo-replica-ctrl:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - acme-letsencrypt:/etc/letsencrypt:ro
    environment:
      OVERLAY_NETWORK_NAME: ${BACKEND_NETWORK_NAME}
      MONGO_SERVICE_NAME: ${MONGO_SERVICE_URI}
      MONGO_HORIZON_SUFFIX: ${MONGO_HORIZON_SUFFIX}
      MONGO_HORIZON_NAME: ${MONGO_HORIZON_NAME}
      MONGO_CERTIFICATE_FILE: /etc/letsencrypt/services/mongo/${MONGO_HORIZON_SUFFIX}.pem
      MONGO_CA_FILE: /etc/letsencrypt/services/mongo/root.pem
      REPLICASET_NAME: ${REPLICASET_NAME}
      MONGO_PORT: 27017
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD_FILE: /run/secrets/mongo-root-password
      INITDB_DATABASE: ${INITDB_DATABASE}
      INITDB_USER: ${INITDB_USER}
      INITDB_PASSWORD_FILE: /run/secrets/initdb-password
      DEBUG: 0
    secrets:
      - mongo-root-password
      - initdb-password
    entrypoint: python /src/db-replica_ctrl.py
    networks:
      - backend
    depends_on:
      - database
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role==manager]
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 1m
        monitor: 10s

  nosqlclient:
    image: mongoclient/mongoclient:latest
    environment:
      MONGOCLIENT_DEFAULT_CONNECTION_URL_FILE: /run/secrets/mongo-client-url
    secrets:
      - mongo-client-url
    depends_on:
      - database
    ports:
      - "${NOSQLCLIENT_PORT:-3030}:3000"
    networks:
        - backend
    deploy:
      mode: replicated
      restart_policy:
        condition: on-failure
      replicas: 1
      placement:
        constraints: [node.role==manager]
        max_replicas_per_node: 1
      update_config:
        parallelism: 1
        delay: 1m
        monitor: 15s

configs:
  mongo-healthcheck:
    file: mongo-healthcheck

secrets:
   mongo-keyfile:
     external: true
   mongo-root-password:
     external: true
     name: ${STACK_NAME}_mongo_root_password
   initdb-password:
     external: true
     name: ${STACK_NAME}_initdb_password
   mongo-client-url:
     external: true
     name: ${STACK_NAME}_mongo_client_url

volumes:
  # NOTE: Must use 'external' for db volumes so they're not recreated during redeployments
  mongodata:
    external: true
    name: ${STACK_NAME}_mongodata
  mongoconfigdb:
    external: true
    name: ${STACK_NAME}_mongoconfigdb
  acme-letsencrypt:
    external: true
    name: acme_rsync_letsencrypt

networks:
  backend:
    name: ${BACKEND_NETWORK_NAME}
    external: true
